<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>

  <!-- ================= LEFT PHONE: LIGHT THEME DRAWER OPEN ================= -->
  <g transform="translate(40, 20)">
    <!-- Device Frame -->
    <rect width="320" height="480" rx="28" fill="#FFF8E7" stroke="#30363d" stroke-width="3" filter="url(#shadow)"/>
    <!-- Status bar -->
    <rect x="0" y="0" width="320" height="28" rx="28" fill="#FFE0B2"/>
    <text x="24" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#E65100">9:41</text>
    <circle cx="280" cy="14" r="4" fill="#E65100"/>
    <circle cx="292" cy="14" r="4" fill="#E65100"/>

    <!-- AppBar Background behind Drawer scrim -->
    <rect x="0" y="28" width="320" height="46" fill="#FFF8E7" stroke-bottom="#E0E0E0"/>
    <text x="160" y="56" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#E65100">Danh sách</text>

    <!-- Semi-transparent scrim -->
    <rect x="0" y="28" width="320" height="452" fill="#000000" opacity="0.45"/>

    <!-- Drawer Panel (slides from left) -->
    <rect x="0" y="28" width="250" height="452" fill="#FFF8E7" filter="url(#shadow)"/>

    <!-- Drawer Header -->
    <rect x="0" y="28" width="250" height="130" fill="#FFE0B2"/>
    <!-- Avatar -->
    <circle cx="50" cy="74" r="26" fill="#E65100"/>
    <path d="M 50 62 A 8 8 0 1 0 50 78 A 8 8 0 1 0 50 62 Z M 36 92 C 36 84 42 80 50 80 C 58 80 64 84 64 92 Z" fill="#FFFFFF"/>
    <!-- Greeting -->
    <text x="20" y="124" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#BF360C">Xin chào, Admin!</text>
    <text x="20" y="142" font-family="-apple-system, sans-serif" font-size="11" fill="#795548">admin@example.com</text>

    <!-- SwitchListTile: Dark Mode -->
    <g transform="translate(16, 170)">
      <circle cx="16" cy="18" r="14" fill="#FFE082"/>
      <!-- Sun icon -->
      <circle cx="16" cy="18" r="6" fill="#E65100"/>
      <text x="40" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#212121">Chế độ tối</text>
      <text x="40" y="28" font-family="-apple-system, sans-serif" font-size="10" fill="#757575">Giao diện Kem - Cam</text>
      <!-- Switch OFF -->
      <rect x="180" y="8" width="38" height="20" rx="10" fill="#BDBDBD"/>
      <circle cx="190" cy="18" r="8" fill="#FFFFFF" filter="url(#shadow)"/>
    </g>

    <!-- Divider -->
    <line x1="16" y1="225" x2="234" y2="225" stroke="#E0E0E0" stroke-width="1"/>

    <!-- Menu Item: Home -->
    <g transform="translate(16, 235)">
      <rect width="218" height="38" rx="8" fill="#FFE0B2" opacity="0.6"/>
      <path d="M 12 24 L 20 16 L 28 24 L 26 24 L 26 30 L 14 30 L 14 24 Z" fill="#E65100"/>
      <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#E65100">Trang chủ</text>
    </g>

    <!-- Bottom Section: Logout -->
    <line x1="16" y1="420" x2="234" y2="420" stroke="#E0E0E0" stroke-width="1"/>
    <g transform="translate(16, 432)">
      <path d="M 14 10 L 22 10 L 22 14 L 14 14 L 14 26 L 22 26 L 22 30 L 14 30 C 12 30 10 28 10 26 L 10 14 C 10 12 12 10 14 10 Z M 24 16 L 28 20 L 24 24 L 24 21 L 18 21 L 18 19 L 24 19 Z" fill="#D32F2F"/>
      <text x="36" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#D32F2F">Đăng xuất</text>
    </g>

    <!-- Light Theme Tag -->
    <rect x="70" y="455" width="180" height="20" rx="6" fill="#E65100"/>
    <text x="160" y="469" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#FFF">LIGHT THEME: Nền Kem, Cam</text>
  </g>

  <!-- ================= RIGHT PHONE: DARK THEME DRAWER OPEN ================= -->
  <g transform="translate(400, 20)">
    <!-- Device Frame -->
    <rect width="320" height="480" rx="28" fill="#000000" stroke="#30363d" stroke-width="3" filter="url(#shadow)"/>
    <!-- Status bar -->
    <rect x="0" y="0" width="320" height="28" rx="28" fill="#121212"/>
    <text x="24" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#2196F3">9:41</text>
    <circle cx="280" cy="14" r="4" fill="#2196F3"/>
    <circle cx="292" cy="14" r="4" fill="#2196F3"/>

    <!-- AppBar Background behind Drawer scrim -->
    <rect x="0" y="28" width="320" height="46" fill="#000000"/>
    <text x="160" y="56" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#2196F3">Danh sách</text>

    <!-- Semi-transparent scrim -->
    <rect x="0" y="28" width="320" height="452" fill="#000000" opacity="0.6"/>

    <!-- Drawer Panel (Dark Mode) -->
    <rect x="0" y="28" width="250" height="452" fill="#121212" filter="url(#shadow)"/>

    <!-- Drawer Header -->
    <rect x="0" y="28" width="250" height="130" fill="#0D47A1"/>
    <!-- Avatar -->
    <circle cx="50" cy="74" r="26" fill="#2196F3"/>
    <path d="M 50 62 A 8 8 0 1 0 50 78 A 8 8 0 1 0 50 62 Z M 36 92 C 36 84 42 80 50 80 C 58 80 64 84 64 92 Z" fill="#FFFFFF"/>
    <!-- Greeting -->
    <text x="20" y="124" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#BBDEFB">Xin chào, Admin!</text>
    <text x="20" y="142" font-family="-apple-system, sans-serif" font-size="11" fill="#90CAF9">admin@example.com</text>

    <!-- SwitchListTile: Dark Mode ON -->
    <g transform="translate(16, 170)">
      <circle cx="16" cy="18" r="14" fill="#1E3A5F"/>
      <!-- Moon icon -->
      <path d="M 14 12 A 7 7 0 1 0 21 21 A 5.5 5.5 0 0 1 14 12 Z" fill="#2196F3"/>
      <text x="40" y="14" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#E0E0E0">Chế độ tối</text>
      <text x="40" y="28" font-family="-apple-system, sans-serif" font-size="10" fill="#9E9E9E">Giao diện Đen - Xanh biển</text>
      <!-- Switch ON -->
      <rect x="180" y="8" width="38" height="20" rx="10" fill="#1976D2"/>
      <circle cx="208" cy="18" r="8" fill="#FFFFFF" filter="url(#shadow)"/>
    </g>

    <!-- Divider -->
    <line x1="16" y1="225" x2="234" y2="225" stroke="#262626" stroke-width="1"/>

    <!-- Menu Item: Home -->
    <g transform="translate(16, 235)">
      <rect width="218" height="38" rx="8" fill="#1E293B" opacity="0.6"/>
      <path d="M 12 24 L 20 16 L 28 24 L 26 24 L 26 30 L 14 30 L 14 24 Z" fill="#2196F3"/>
      <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#2196F3">Trang chủ</text>
    </g>

    <!-- Bottom Section: Logout -->
    <line x1="16" y1="420" x2="234" y2="420" stroke="#262626" stroke-width="1"/>
    <g transform="translate(16, 432)">
      <path d="M 14 10 L 22 10 L 22 14 L 14 14 L 14 26 L 22 26 L 22 30 L 14 30 C 12 30 10 28 10 26 L 10 14 C 10 12 12 10 14 10 Z M 24 16 L 28 20 L 24 24 L 24 21 L 18 21 L 18 19 L 24 19 Z" fill="#EF5350"/>
      <text x="36" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#EF5350">Đăng xuất</text>
    </g>

    <!-- Dark Theme Tag -->
    <rect x="70" y="455" width="180" height="20" rx="6" fill="#1976D2"/>
    <text x="160" y="469" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#FFF">DARK THEME: Nền Đen, Xanh</text>
  </g>
</svg>
