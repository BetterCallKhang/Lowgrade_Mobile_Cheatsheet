<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <filter id="shadow-dialog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Screen (Làm tối mờ màn hình nền) -->
  <rect width="360" height="640" fill="#2b2d30" rx="16"/>
  <rect width="360" height="640" fill="#000000" opacity="0.5" rx="16"/>

  <!-- Flutter Material 3 AlertDialog (Xác nhận xóa) -->
  <g transform="translate(30, 220)" filter="url(#shadow-dialog)">
    <!-- Dialog Surface Background -->
    <rect width="300" height="180" rx="28" fill="#ECE6F0"/>

    <!-- Dialog Title: Text('Xác nhận xóa') -->
    <text x="24" y="44" fill="#1D1B20" font-family="Roboto, sans-serif" font-size="20" font-weight="600">Xác nhận xóa</text>

    <!-- Dialog Content: Text('Bạn có chắc muốn xóa "Sản phẩm mẫu số 1"?') -->
    <text x="24" y="80" fill="#49454F" font-family="Roboto, sans-serif" font-size="14">Bạn có chắc chắn muốn xóa</text>
    <text x="24" y="102" fill="#1D1B20" font-family="Roboto, sans-serif" font-size="14" font-weight="bold">"Sản phẩm mẫu số 1"?</text>

    <!-- Actions: TextButton Hủy & ElevatedButton Xóa -->
    <!-- Nút Hủy (TextButton) -->
    <text x="175" y="152" fill="#6750A4" font-family="Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">HỦY</text>

    <!-- Nút Xóa (ElevatedButton màu đỏ) -->
    <g transform="translate(210, 130)">
      <rect width="70" height="36" rx="18" fill="#B3261E"/>
      <text x="35" y="22" fill="#ffffff" font-family="Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">XÓA</text>
    </g>
  </g>

  <!-- Status / Caption -->
  <g transform="translate(20, 580)">
    <rect width="320" height="32" rx="6" fill="#F3EDF7"/>
    <text x="160" y="20" fill="#49454F" font-family="Roboto, sans-serif" font-size="12" text-anchor="middle">Hộp thoại AlertDialog xác nhận trước khi xóa trong SQLite</text>
  </g>
</svg>

